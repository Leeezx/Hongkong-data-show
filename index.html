<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hong Kong Remote Sensing Water Quality Monitoring Demonstration System</title>
  <link rel="stylesheet" href="assets/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=20261001-dynamic-tiles">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V28SBMMNE7"></script>
  <script>
    window.dataLayer = window.dataLayer || []
    function gtag() { dataLayer.push(arguments) }
    gtag('js', new Date())
    gtag('config', 'G-V28SBMMNE7')
  </script>
  <!-- GoatCounter records pageviews and provides the public total counter. -->
  <script data-goatcounter="https://lzx.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>Hong Kong Remote Sensing Water Quality Monitoring Demonstration System</h1>
      <div class="site-counter" aria-live="polite" aria-label="网站累计访问量">
        累计访问量：<span id="site-counter-value">加载中…</span>
      </div>
      <nav id="primary-nav" class="app-nav" aria-label="Primary navigation">
        <button data-section="environment" class="nav-link is-active">Water Environment Data</button>
        <button data-section="historical" class="nav-link">Historical Water Quality</button>
        <button data-section="forecasts" class="nav-link">Water Quality Forecasts</button>
        <button data-section="alerts" class="nav-link">Risk Alerts &amp; Recommended Actions</button>
      </nav>
    </header>
    <main id="data-view" class="data-view">
      <aside id="sidebar" class="sidebar">
        <section class="sidebar-section"><h2>Data Layers</h2><div id="layer-list" class="layer-list"></div></section>
        <section class="sidebar-section"><label class="control-label" for="opacity">Opacity</label><input id="opacity" type="range" min="0" max="1" step="0.05" value="0.75"><output id="opacity-value">75%</output></section>
        <section class="sidebar-section"><h2>Timeline</h2>
          <div id="timeline-label" class="timeline-label">2016-01-01</div>
          <div class="timeline">
            <button type="button" aria-label="Previous time step">◀</button>
            <div class="timeline-rail"><span></span></div>
            <button type="button" aria-label="Next time step">▶</button>
          </div>
          <button type="button" class="play-button">▶ Play</button>
        </section>
        <section class="sidebar-section"><h2>Spatial Query</h2>
          <p>Click the map to query pixel values; hold Shift and drag to select an area.</p>
        </section>
      </aside>
      <section class="map-area" aria-label="Hong Kong water-quality map">
        <div id="map"></div>
        <div id="map-notice" class="map-notice" aria-live="polite" hidden></div>
        <aside id="legend" class="legend" aria-label="Map legend"></aside>
      </section>
    </main>
    <main id="placeholder-view" class="placeholder-view" hidden><div><h2></h2><p>Demonstration module — no functionality implemented</p></div></main>
  </div>
  <script src="assets/leaflet/leaflet.js"></script>
  <script src="assets/metadata.js"></script>
  <script src="assets/material/metadata.js"></script>
  <script src="assets/map-data.js"></script>
  <script src="app.js?v=20261001-dynamic-tiles"></script>
</body>
</html>
